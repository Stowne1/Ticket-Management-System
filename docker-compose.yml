
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ticketuser
      POSTGRES_PASSWORD: ticketpass
      POSTGRES_DB: ticketdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # healthcheck polls pg_isready until Postgres is actually accepting connections.
    # The app service below uses `condition: service_healthy` to wait for this.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketuser -d ticketdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        # Wait until the db healthcheck passes before starting the app.
        # This replaces the fragile `sleep 5` approach — Docker tracks the
        # actual readiness state rather than guessing a fixed delay.
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://ticketuser:ticketpass@db:5432/ticketdb?sslmode=disable
      # In production replace this with a long random string (e.g. openssl rand -hex 32).
      JWT_SECRET: local-dev-secret-change-in-production
    ports:
      - "8080:8080"

volumes:
  pgdata:
